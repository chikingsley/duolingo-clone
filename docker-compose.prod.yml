version: '3.8'

services:
  # Production Full-Stack Bun Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: lingo-fullstack-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_ADMIN_IDS=${CLERK_ADMIN_IDS}
      - STRIPE_API_SECRET_KEY=${STRIPE_API_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - APP_URL=${APP_URL}
    env_file:
      - .env
    restart: always
    networks:
      - lingo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  lingo-network:
    driver: bridge
